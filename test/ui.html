<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merlin AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
        }

        

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        .container {
            display: flex;
            height: 100vh;
            opacity: 0;
            animation: fadeIn ease-out  forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .sidebar {
            width: 260px;
            background: #111111;
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            transition: all 0.3s ease;
        }

        .sidebar-header {
            padding: 0 20px 30px;
        }

        .new-chat-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .new-chat-btn:hover {
            background: #2a2a2a;
            border-color: #444;
            transform: translateY(-1px);
        }

        .new-chat-btn .icon {
            font-size: 16px;
        }

        .sidebar-menu {
            flex: 1;
            padding: 0 20px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #888;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .menu-item:hover {
            background: #1a1a1a;
            color: #fff;
            transform: translateX(4px);
        }

        .menu-item .icon {
            font-size: 16px;
        }

        .sidebar-footer {
            padding: 0 20px;
            border-top: 1px solid #222;
            padding-top: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #888;
            font-size: 13px;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #4a9eff, #6b73ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: white;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at top, #0f1419 0%, #0a0a0a 70%);
            position: relative;
        }

        .welcome-section {
            text-align: center;
            max-width: 600px;
            padding: 40px;
        }

        .welcome-title {
            font-size: 48px;
            font-weight: 300;
            margin-bottom: 60px;
            background: linear-gradient(135deg, #ffffff, #888888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleGlow 3s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 1; }
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        .action-btn {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            color: #fff;
        }

        .action-btn:hover {
            background: #222;
            border-color: #4a9eff;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(74, 158, 255, 0.1);
        }

        .action-btn .icon {
            font-size: 20px;
            margin-bottom: 8px;
            color: #4a9eff;
        }

        .action-btn .title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .action-btn .subtitle {
            font-size: 12px;
            color: #888;
        }

        .chat-documents {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #fff;
            width: 100%;
        }

        .chat-documents:hover {
            background: #222;
            border-color: #4a9eff;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(74, 158, 255, 0.1);
        }

        .chat-documents .icon {
            font-size: 20px;
            margin-bottom: 8px;
            color: #4a9eff;
        }

        .chat-documents .title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .chat-documents .subtitle {
            font-size: 12px;
            color: #888;
        }

        .floating-orb {
            position: absolute;
            top: 20%;
            right: 20%;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(74, 158, 255, 0.1), transparent);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        .mini-indicator {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #666;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #4a9eff;
            border-radius: 50%;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 70px;
                padding: 20px 10px;
            }
            
            .sidebar-header, .sidebar-menu {
                padding: 0 10px;
            }
            
            .new-chat-btn .text,
            .menu-item .text {
                display: none;
            }
            
            .welcome-title {
                font-size: 36px;
            }
            
            .action-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Loader -->
    

    <!-- Main UI -->
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn">
                    <span class="icon">+</span>
                    <span class="text">New</span>
                </button>
            </div>

            <div class="sidebar-menu">
                <div class="menu-item">
                    <span class="icon">🕒</span>
                    <span class="text">History</span>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">M</div>
                    <span>Mini</span>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="floating-orb"></div>
            
            <div class="welcome-section">
                <h1 class="welcome-title">Welcome to Merlin</h1>
                
                <div class="action-buttons">
                    <button class="action-btn">
                        <div class="icon">🖼️</div>
                        <div class="title">generate image</div>
                        <div class="subtitle">Create visuals with AI</div>
                    </button>
                    
                    <button class="action-btn">
                        <div class="icon">🌐</div>
                        <div class="title">research with web</div>
                        <div class="subtitle">Search and analyze</div>
                    </button>
                </div>

                <button class="chat-documents">
                    <div class="icon">📄</div>
                    <div class="title">chat with documents</div>
                    <div class="subtitle">Upload and discuss files</div>
                </button>
            </div>

            <div class="mini-indicator">
                <div class="status-dot"></div>
                <input type="text" value="Mini" readonly style="background: transparent; border: solid 4px; color: #666; font-size: 12px; width: 400px;">
            </div>
        </div>
    </div>

    <script>
        // Add subtle interactions
        document.addEventListener('DOMContentLoaded', function() {
            // Stagger animation for action buttons
            const actionBtns = document.querySelectorAll('.action-btn, .chat-documents');
            actionBtns.forEach((btn, index) => {
                btn.style.animationDelay = `${2.8 + index * 0.1}s`;
                btn.style.animation = 'fadeIn 0.6s ease-out forwards';
                btn.style.opacity = '0';
            });

            // Add click ripple effect
            actionBtns.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const ripple = document.createElement('div');
                    const rect = btn.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height);
                    const x = e.clientX - rect.left - size / 2;
                    const y = e.clientY - rect.top - size / 2;
                    
                    ripple.style.cssText = `
                        position: absolute;
                        width: ${size}px;
                        height: ${size}px;
                        left: ${x}px;
                        top: ${y}px;
                        background: rgba(74, 158, 255, 0.3);
                        border-radius: 50%;
                        pointer-events: none;
                        animation: ripple 0.6s ease-out;
                    `;
                    
                    btn.style.position = 'relative';
                    btn.style.overflow = 'hidden';
                    btn.appendChild(ripple);
                    
                    setTimeout(() => ripple.remove(), 600);
                });
            });

            // Subtle sidebar interactions
            const menuItems = document.querySelectorAll('.menu-item, .new-chat-btn');
            menuItems.forEach(item => {
                item.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateX(4px)';
                });
                
                item.addEventListener('mouseleave', function() {
                    this.style.transform = 'translateX(0)';
                });
            });
        });

        // Add ripple animation keyframes
        
        document.head.appendChild(style);
    </script>
</body>
</html>
